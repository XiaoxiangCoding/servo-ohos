# Known QuickJS defects relative to the SpiderMonkey contract.
#
# SpiderMonkey is the reference implementation. Each entry names one case and the compared fields
# that may differ. The comparison still prints every known defect; an unlisted difference fails
# the run. Never add an entry merely to silence a failure, and remove it when the shim is fixed.
#
# status:   pending | bug | accepted | wontfix. Only accepted and wontfix are released by
#           `run.sh diff`; pending and bug still fail the comparison.
# severity: P0 | P1 | P2 | P3. P0 and P1 cannot be released as accepted/wontfix.
#
# Optional: `issue` links the tracking issue for a difference that is still present. `pending`
# and `bug` entries must name a real tracking issue; accepted/wontfix entries may omit it.
#
# Optional: `panic` is an exact QuickJS panic fingerprint. Use it instead of relying on
# `fields = ["fields"]` for a case that aborts: panic text that changes, or a panic where none is
# listed, fails the comparison. When a difference is fixed, add a record to `fix-record.md`, then
# delete the entry here.

[[difference]]
id = "rooter.trace_on_gc"
fields = ["fields"]
reason = "QuickJS does not invoke CustomAutoRooter trace callbacks during an explicit collection"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"
issue = "servo-quickjs#16"

[[difference]]
id = "objects.core"
fields = ["fields", "apis"]
panic = """assertion `left == right` failed
  left: ([3], 1)
 right: ([], 0)"""
reason = "JSITER_SYMBOLSONLY is a proxy-only flag in SpiderMonkey; QuickJS also treats it as symbol selection for ordinary objects"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "strings.core"
fields = ["fields", "apis"]
panic = '''assertion `left == right` failed: ValueToSource(({a: 1, 'b c': [2], 3: undefined, [Symbol.iterator]: 0}))
  left: "({3:(void 0), a:1, \"b c\":[2], [Symbol.iterator]:0})"
 right: "({3:(void 0), a:1, 'b c':[2], [Symbol.iterator]:0})"'''
reason = "JS_ValueToSource uses double quotes for property names; SpiderMonkey keeps the source quote style"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "misc.gc_state"
fields = ["fields", "apis"]
panic = """assertion `left == right` failed
  left: Ok("Object")
 right: Ok("JS Object")"""
reason = "GCTraceKindToAscii returns QuickJS class names such as Object; SpiderMonkey returns JS Object"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "errors.core"
fields = ["fields", "apis"]
panic = """assertion `left == right` failed
  left: (2, 22)
 right: (2, 9)"""
reason = "QuickJS reports the Error construction column; SpiderMonkey reports the throw site column"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "misc.gc_callbacks"
fields = ["fields"]
panic = "JS_SetGCCallback callback did not run"
reason = "QuickJS keeps JS_SetGCCallback as a silent no-op, so the registered callback never runs during JS_GC"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "misc.standard_classes"
fields = ["fields"]
panic = "standard class enumeration returned no names"
reason = "QuickJS implements JS_NewEnumerateStandardClasses, JS_ResolveStandardClass and JS_MayResolveStandardClass as no-ops, so no lazily resolved standard class names are enumerated"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "promise.internal_job_queue"
fields = ["fields", "apis"]
panic = "assertion failed: HasAnyMicroTasks(cx)"
reason = "QuickJS does not enqueue promise reactions into the internal job queue exposed to HasAnyMicroTasks; RunJobs still drains QuickJS's own queue"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "debugger.global_object"
fields = ["fields"]
reason = "QuickJS binds JS_DefineDebuggerObject to a qjs_todo! stub that aborts across extern C; the case records the precondition and Servo does not compile the call for js-quickjs"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
id = "streaming.consume_callback"
fields = ["fields"]
reason = "QuickJS has no WebAssembly and binds the StreamConsumer glue entry points to qjs_todo!; the case records the unavailable streaming precondition and does not call them"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

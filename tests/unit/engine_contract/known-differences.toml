# Known QuickJS defects relative to the SpiderMonkey contract.
#
# SpiderMonkey is the reference implementation. Each entry names one case and the compared fields
# that may differ. The comparison still prints every known defect; an unlisted difference fails
# the run. Never add an entry merely to silence a failure, and remove it when the shim is fixed.

[[difference]]
id = "rooter.trace_on_gc"
fields = ["fields"]
reason = "QuickJS does not invoke CustomAutoRooter trace callbacks during an explicit collection"
owner = "servo-quickjs"

[[difference]]
id = "objects.core"
fields = ["fields", "apis"]
reason = "JSITER_SYMBOLSONLY is a proxy-only flag in SpiderMonkey; QuickJS also treats it as symbol selection for ordinary objects"
owner = "servo-quickjs"

[[difference]]
id = "strings.core"
fields = ["fields"]
reason = "JS_ValueToSource uses double quotes for property names; SpiderMonkey keeps the source quote style"
owner = "servo-quickjs"

[[difference]]
id = "misc.gc_state"
fields = ["fields", "apis"]
reason = "GCTraceKindToAscii returns QuickJS class names such as Object; SpiderMonkey returns JS Object"
owner = "servo-quickjs"

[[difference]]
id = "errors.core"
fields = ["fields", "apis"]
reason = "QuickJS reports the Error construction column; SpiderMonkey reports the throw site column"
owner = "servo-quickjs"

[[difference]]
id = "misc.gc_callbacks"
fields = ["fields"]
reason = "QuickJS keeps JS_SetGCCallback as a silent no-op, so the registered callback never runs during JS_GC"
owner = "servo-quickjs"

[[difference]]
id = "misc.standard_classes"
fields = ["fields"]
reason = "QuickJS implements JS_NewEnumerateStandardClasses, JS_ResolveStandardClass and JS_MayResolveStandardClass as no-ops, so no lazily resolved standard class names are enumerated"
owner = "servo-quickjs"

[[difference]]
id = "promise.internal_job_queue"
fields = ["fields", "apis"]
reason = "QuickJS does not enqueue promise reactions into the internal job queue exposed to HasAnyMicroTasks; RunJobs still drains QuickJS's own queue"
owner = "servo-quickjs"

[[difference]]
id = "debugger.global_object"
fields = ["fields"]
reason = "QuickJS binds JS_DefineDebuggerObject to a qjs_todo! stub that aborts across extern C; the case records the precondition and Servo does not compile the call for js-quickjs"
owner = "servo-quickjs"
